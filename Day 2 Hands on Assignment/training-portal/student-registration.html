<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration Form</title>
</head>
<body>

    <h1>Student Registration Form</h1>

    <form action="#" method="post">

        <!-- Name -->
        <label for="name">Full Name:</label><br>
        <input 
            type="text" 
            id="name" 
            name="name" 
            required 
            minlength="3"
        >
        <br><br>

        <!-- Email -->
        <label for="email">Email Address:</label><br>
        <input 
            type="email" 
            id="email" 
            name="email" 
            required
        >
        <br><br>

        <!-- Phone -->
        <label for="phone">Phone Number:</label><br>
        <input 
            type="tel" 
            id="phone" 
            name="phone"
            pattern="[0-9]{10}"
            placeholder="Enter 10-digit number"
            required
        >
        <br><br>

        <!-- Age -->
        <label for="age">Age:</label><br>
        <input 
            type="number" 
            id="age" 
            name="age"
            min="16"
            max="60"
            required
        >
        <br><br>

        <!-- Date of Birth -->
        <label for="dob">Date of Birth:</label><br>
        <input 
            type="date" 
            id="dob" 
            name="dob"
            required
        >
        <br><br>

        <!-- Submit Button -->
        <input type="submit" value="Register">

    </form>

</body>
</html>
