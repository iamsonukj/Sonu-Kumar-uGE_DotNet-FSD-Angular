<!DOCTYPE html>
<html>
<head>
    <title>MediCare Clinic</title>
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        .doctor-profile {
            background-color: #e6f4ff;
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<!-- Inline CSS -->
<div style="background:red;color:white;padding:10px;text-align:center;">
    Emergency: 24x7 Services Available
</div>

<header>
    <h1>MediCare Clinic</h1>
    <nav>
        <a href="#">Home</a>
        <a href="#">Services</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<section class="banner">
    <h2>Your Health, Our Priority</h2>
</section>

<section class="services">
    <div class="service-card">
        <h3>Cardiology</h3>
        <p>Heart care specialists</p>
    </div>
    <div class="service-card">
        <h3>Neurology</h3>
        <p>Brain & nerve care</p>
    </div>
    <div class="service-card">
        <h3>Orthopedics</h3>
        <p>Bone & joint care</p>
    </div>
</section>

<section class="doctor-profile">
    <h2>Dr. Smith</h2>
    <p>Senior Physician</p>
</section>

<section id="contact">
    <input type="text" placeholder="Your Name">
    <button>Submit</button>
</section>

<footer>
    <p>© 2026 MediCare Clinic</p>
</footer>

</body>
</html>
