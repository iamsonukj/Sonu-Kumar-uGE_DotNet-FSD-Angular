<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Enrollment Form</title>
</head>
<body>

    <header>
        <h1>Online Learning Platform</h1>
    </header>

    <main>

        <section>
            <h2>Course Enrollment Form</h2>

            <!-- Static Enrollment Progress -->
            <p>Enrollment Completion Progress:</p>
            <progress value="60" max="100"></progress>
            <p>60% Completed</p>

            <form action="#" method="post">

                <!-- Full Name -->
                <label for="name">Full Name:</label><br>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    required 
                    minlength="3">
                <br><br>

                <!-- Email -->
                <label for="email">Email Address:</label><br>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    required>
                <br><br>

                <!-- Course Selection using Datalist -->
                <label for="course">Select Course:</label><br>
                <input 
                    list="course-options" 
                    id="course" 
                    name="course" 
                    required>

                <datalist id="course-options">
                    <option value="HTML Fundamentals">
                    <option value="CSS Mastery">
                    <option value="JavaScript Basics">
                    <option value="Full Stack Development">
                    <option value="Data Structures in Java">
                </datalist>
                <br><br>

                <!-- Age -->
                <label for="age">Age:</label><br>
                <input 
                    type="number" 
                    id="age" 
                    name="age"
                    min="16"
                    max="60"
                    required>
                <br><br>

                <!-- Experience Range -->
                <label for="experience">
                    Years of Experience (0–10):
                </label><br>
                <input 
                    type="range" 
                    id="experience" 
                    name="experience"
                    min="0"
                    max="10"
                    value="2">
                <br><br>

                <!-- Skill Level Meter -->
                <label for="skill">Skill Level:</label><br>
                <meter 
                    id="skill"
                    min="0"
                    max="100"
                    low="30"
                    high="70"
                    optimum="90"
                    value="50">
                </meter>
                <p>Beginner → Intermediate → Advanced</p>
                <br>

                <!-- Submit -->
                <input type="submit" value="Enroll Now">

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Online Learning Platform</p>
    </footer>

</body>
</html>
